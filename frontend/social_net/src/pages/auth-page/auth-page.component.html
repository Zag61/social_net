<section class="auth-page">
  <div class="logo-box">
    <h1 class="title">Geist</h1>
    <img src="icon-13.svg" alt="logo" />
    <h2 class="subtitle">Progress unites</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="auth">
    <label>
      <span>Email</span>
      <input type="email" formControlName="email" placeholder="you@example.com" />
    </label>

    <label class="password-field">
      <span>Password</span>

      <div class="password-input">
        <input [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="••••••••" />
        <button type="button" class="toggle-password" (click)="togglePassword()"
          [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'">
          {{ hidePassword ? 'Show' : 'Hide' }}
        </button>
      </div>
    </label>

    <div class="row">
      <button type="submit" class="btn btn-primary" [disabled]="loading()">Sign in</button>
      <button type="button" class="btn btn-ghost" (click)="goRegister()">Register</button>
    </div>
  </form>

  <div class="divider"><span>or</span></div>

  <button type="button" class="btn btn-google" (click)="onGoogle()">Sign in with Google</button>

  @if (error()){<div class="error">{{ error() }}</div>}
</section>
