<h1>Register</h1>

<form [formGroup]="form" (ngSubmit)="submit()" class="register">
  <input type="email"placeholder="you@example.com"  formControlName="email" />
  <input placeholder="Nickname" formControlName="nickname" />
  <input type="password" placeholder="Password" formControlName="password" />

  <button type="submit"  class="btn btn-primary" [disabled]="loading()">Register</button>
  <button type="button" class="btn btn-ghost" (click)="back()">Back</button>

  <p *ngIf="message()">{{ message() }}</p>
  <p *ngIf="error()" class="error">{{ error() }}</p>
</form>
